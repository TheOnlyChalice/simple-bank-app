spring.application.name=simple-bank
server.port=8080

# ----- MongoDB Atlas -----
# The connection string (including the password) comes from the MONGODB_URI
# environment variable, so it is never committed.
spring.mongodb.uri=${MONGODB_URI}
# Store BigDecimal money values as MongoDB's exact Decimal128 type, not as strings
spring.data.mongodb.representation.big-decimal=decimal128
# Create the indexes declared on the documents (@Indexed, @CompoundIndex) at startup
spring.data.mongodb.auto-index-creation=true

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

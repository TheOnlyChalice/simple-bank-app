spring.application.name=simple-bank
server.port=8080

# ----- MongoDB Atlas -----
# The connection string (including the password) comes from the MONGODB_URI
# environment variable, so it is never committed.
spring.mongodb.uri=${MONGODB_URI}
# Store BigDecimal money values as MongoDB's exact Decimal128 type, not as strings
spring.data.mongodb.representation.big-decimal=decimal128
# Create the indexes declared on the documents (@Indexed, @CompoundIndex) at startup
spring.data.mongodb.auto-index-creation=true

# ----- Security (JWT) -----
# Key that signs login tokens (HS256). At least 32 characters, from the JWT_SECRET
# environment variable, never committed. Anyone with this key could forge tokens.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=simple-bank
# How long a login lasts before the user has to log in again
app.jwt.expiration=1h

# First admin (bank staff) account, created at startup if it doesn't exist yet
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

spring.application.name=simple-bank
server.port=8080

# ----- Database (MySQL) -----
# The password comes from the DB_PASSWORD environment variable so it is never committed.
# The username defaults to bankapp but can be overridden with DB_USERNAME.
spring.datasource.url=jdbc:mysql://localhost:3306/simple_bank
spring.datasource.username=${DB_USERNAME:bankapp}
spring.datasource.password=${DB_PASSWORD}

# ----- JPA / Hibernate -----
# The tables are created by database/schema.sql, not by Hibernate.
# "validate" checks at startup that the Java entities match those tables, and refuses to start if not.
spring.jpa.hibernate.ddl-auto=validate
# Close the database session when each service call finishes, not at the end of the HTTP request
spring.jpa.open-in-view=false

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# ----- MongoDB Atlas -----
# The connection string (including the password) comes from the MONGODB_URI
# environment variable, so it is never committed.
spring.mongodb.uri=${MONGODB_URI}
# Store BigDecimal money values as MongoDB's exact Decimal128 type, not as strings
spring.data.mongodb.representation.big-decimal=decimal128

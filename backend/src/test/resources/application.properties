# Test settings: replaces src/main/resources/application.properties when tests run.
# Tests never touch Atlas: MongoTestBase starts MongoDB in Docker and points the app at it.
spring.application.name=simple-bank
spring.data.mongodb.representation.big-decimal=decimal128
spring.data.mongodb.auto-index-creation=true

# A fixed signing key for tests only (the real one comes from JWT_SECRET)
app.jwt.secret=test-only-signing-key-that-is-long-enough-for-hs256
app.jwt.issuer=simple-bank
app.jwt.expiration=1h
# No admin is created automatically in tests; tests create the users they need
app.admin.email=
app.admin.password=

# Tests run due scheduled transfers themselves, at a chosen time, so the background job is off
app.scheduled-transfers.enabled=false

# The same local frontend addresses as the main settings (the CORS tests use localhost:5173)
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173,http://localhost:3000

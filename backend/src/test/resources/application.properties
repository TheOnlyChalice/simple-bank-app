# Test settings: replaces src/main/resources/application.properties when tests run.
# Tests use H2, an in-memory database, so they don't need MySQL or DB_PASSWORD.
spring.datasource.url=jdbc:h2:mem:simplebank;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the tables from the entities at the start of the test run
# and drops them at the end.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
